<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#17140e" />
  <title>Guild Legacy — Story RPG</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="screen-noise" aria-hidden="true"></div>
  <main class="game-shell">
    <header class="topbar pixel-frame">
      <div>
        <div class="eyebrow">GUILD LEGACY · STORY RPG</div>
        <h1 id="chapterTitle">Capítulo I</h1>
      </div>
      <div class="status-pill"><span class="status-dot"></span><span id="sceneCounter">Escena 02</span></div>
    </header>

    <section class="scene-layout">
      <article class="scene-panel pixel-frame">
        <div class="scene-image-wrap">
          <img id="sceneImage" src="assets/scenes/scene_002.webp" alt="Escena actual de la aventura" />
          <div class="image-vignette"></div>
          <div class="scene-tag" id="sceneTag">EL EXPLORADOR ENTRA SOLO</div>
        </div>

        <div class="story-box">
          <div class="speaker-rune">✦</div>
          <div>
            <h2 id="sceneTitle">El explorador entra solo</h2>
            <div id="storyText" class="story-text"></div>
          </div>
        </div>
      </article>

      <aside class="party-panel pixel-frame">
        <div class="panel-title">PARTY</div>
        <div id="partyList" class="party-list"></div>
        <button id="partyDetailsBtn" class="secondary-btn" type="button">Ver detalles del grupo</button>
      </aside>
    </section>

    <section class="choice-panel pixel-frame">
      <div class="choice-header">
        <span>¿QUÉ HACE LA PARTY?</span>
        <span class="choice-hint">elige una opción</span>
      </div>
      <div id="choices" class="choices"></div>
      <div id="choiceResult" class="choice-result" hidden></div>
    </section>

    <footer class="footer-bar">
      <button id="historyBtn" class="footer-btn" type="button">Historia</button>
      <span>La aventura se actualiza contigo en ChatGPT.</span>
      <button id="resetChoiceBtn" class="footer-btn" type="button">Cambiar elección</button>
    </footer>
  </main>

  <dialog id="modal" class="modal pixel-frame">
    <div class="modal-head">
      <strong id="modalTitle">Detalles</strong>
      <button id="modalClose" aria-label="Cerrar">×</button>
    </div>
    <div id="modalBody" class="modal-body"></div>
  </dialog>

  <script src="js/game.js"></script>
</body>
</html>
